* { box-sizing: border-box; }
html { background: var(--abyss); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--abyss);
  color: var(--foam);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  padding-block: 64px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Moving ocean */
.sea, .tint, .sheen { position: fixed; pointer-events: none; z-index: 0; }
.sea {
  inset: -10%;
  background-image: var(--wave);
  background-size: cover;
  background-position: center;
  animation: drift 32s ease-in-out infinite alternate;
  will-change: transform;
}
.sea-2 {
  opacity: 0.85;
  mix-blend-mode: soft-light;
  animation: drift-2 44s ease-in-out infinite alternate;
}
.tint {
  inset: 0;
  background:
    radial-gradient(70% 36% at 50% 20%, rgba(150, 205, 255, 0.26), transparent 70%),
    linear-gradient(180deg, rgba(4, 26, 70, 0.3) 0%, rgba(4, 20, 56, 0.6) 45%, rgba(2, 10, 28, 0.9) 100%);
}
.sheen {
  inset: 0;
  background: linear-gradient(105deg, transparent 38%, rgba(190, 225, 255, 0.1) 50%, transparent 62%);
  background-size: 260% 100%;
  animation: sheen 18s linear infinite;
}
@keyframes drift {
  from { transform: translate3d(-2.5%, -1.5%, 0) scale(1.06); }
  to   { transform: translate3d(2.5%, 1.5%, 0) scale(1.14); }
}
@keyframes drift-2 {
  from { transform: translate3d(3%, 1%, 0) scale(-1.12, 1.12); }
  to   { transform: translate3d(-3%, -2%, 0) scale(-1.2, 1.2); }
}
@keyframes sheen {
  from { background-position: 130% 0; }
  to   { background-position: -130% 0; }
}

.page {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

/* Hero */
.hero { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 100%; }
.badge { position: relative; width: 208px; height: 208px; display: grid; place-items: center; }
.badge::before {
  content: "";
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(120, 190, 255, 0.3), transparent 68%);
}
.ring, .sweep { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring { animation: spin 140s linear infinite; }
.sweep { animation: spin 20s linear infinite reverse; }
.tk { stroke: var(--mist); stroke-width: 0.8; opacity: 0.55; }
.tk.l { stroke: var(--foam); stroke-width: 1.3; opacity: 0.9; }
.arc { fill: none; stroke: var(--foam); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 46 314; }
.flower {
  position: relative;
  width: 122px;
  height: 122px;
  object-fit: contain;
  filter: drop-shadow(0 10px 26px rgba(110, 180, 255, 0.5));
  animation: float 7s ease-in-out infinite alternate;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float {
  from { transform: translateY(-5px) rotate(-2deg); }
  to   { transform: translateY(5px) rotate(2deg); }
}
.name {
  margin: 0;
  text-align: center;
  font-weight: 300;
  font-size: clamp(22px, 6.6vw, 32px);
  line-height: 1.3;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-wrap: balance;
}
.rule { width: 44px; height: 2px; background: var(--foam); opacity: 0.9; }

/* Links */
.links { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.link {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 68px;
  padding-left: 18px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: inherit;
  text-decoration: none;
  transition: background 0.25s ease, border-color 0.25s ease;
}
.link:hover, .link:active { background: var(--glass-hi); border-color: var(--foam); }
.link:focus-visible { outline: 2px solid var(--foam); outline-offset: 3px; }
.ico { flex: none; width: 24px; height: 24px; color: var(--mist); display: block; }
.ico svg { width: 24px; height: 24px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico svg text { fill: currentColor; stroke: none; font-family: var(--font); font-weight: 700; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nm { font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; }
.hd { font-size: 13px; color: var(--mist); letter-spacing: 0.02em; overflow-wrap: anywhere; }
.go {
  flex: none;
  align-self: stretch;
  width: 64px;
  display: grid;
  place-items: center;
  border-left: 1px solid var(--line);
  color: var(--foam);
  transition: background 0.25s ease, color 0.25s ease;
}
.go svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s ease; }
.link:hover .go, .link:focus-visible .go { background: var(--foam); color: var(--abyss); }
.link:hover .go svg { transform: translateX(3px); }

@media (prefers-reduced-motion: reduce) {
  .sea, .sheen, .ring, .sweep, .flower { animation: none; }
  .link, .go, .go svg { transition: none; }
}
</style>
