:root {
  --abyss: #030c1f;
  --deep: #06183a;
  --foam: #e3f0ff;
  --mist: #9fc4ea;
  --glass: rgba(5, 18, 44, 0.6);
  --glass-hi: rgba(16, 46, 98, 0.72);
  --line: rgba(227, 240, 255, 0.24);
  --font: "Barlow", "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--abyss); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--abyss);
  color: var(--foam);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  padding-block: 64px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Liquid glass drawn live by a small shader, over a blue gradient fallback. Flower and bars sit on top. */
.sea, .tint { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.sea { background: linear-gradient(160deg, #3a7bbd 0%, #1c4f95 40%, #0a2a63 75%, #051a42 100%); }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 0.9s ease; }
#bg.ready { opacity: 1; }
.tint {
  background:
    radial-gradient(60% 30% at 50% 36%, rgba(3, 14, 40, 0.3), transparent 75%),
    linear-gradient(180deg, rgba(3, 14, 40, 0.1) 0%, rgba(3, 14, 40, 0.24) 50%, rgba(2, 8, 24, 0.55) 100%);
}

.page {
  position: relative;
  z-index: 1;
  max-width: 440px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
}

/* Hero */
.hero { display: flex; flex-direction: column; align-items: center; gap: 26px; width: 100%; }
.badge { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
.badge::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(120, 190, 255, 0.3), transparent 68%);
}
.ring, .sweep { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring { animation: spin 140s linear infinite; }
.sweep { animation: spin 20s linear infinite reverse; }
.tk { stroke: var(--mist); stroke-width: 0.8; opacity: 0.55; }
.tk.l { stroke: var(--foam); stroke-width: 1.3; opacity: 0.9; }
.arc { fill: none; stroke: var(--foam); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 46 314; }
.flower {
  position: relative;
  width: 150px;
  height: 150px;
  object-fit: contain;
  filter: drop-shadow(0 10px 26px rgba(110, 180, 255, 0.5));
  animation: float 7s ease-in-out infinite alternate;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes float {
  from { transform: translateY(-5px) rotate(-2deg); }
  to   { transform: translateY(5px) rotate(2deg); }
}
.name {
  margin: 0;
  text-align: center;
  font-weight: 500;
  font-size: clamp(25px, 7.4vw, 38px);
  line-height: 1.3;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-wrap: balance;
  text-shadow: 0 2px 18px rgba(2, 10, 30, 0.55);
}
.rule { width: 44px; height: 2px; background: var(--foam); opacity: 0.9; }

/* Links */
.links { list-style: none; margin: 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.link {
  display: flex;
  align-items: center;
  gap: 16px;
  min-height: 68px;
  padding-left: 18px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  color: inherit;
  text-decoration: none;
  transition: background 0.25s ease, border-color 0.25s ease;
}
.link:hover, .link:active { background: var(--glass-hi); border-color: var(--foam); }
.link:focus-visible { outline: 2px solid var(--foam); outline-offset: 3px; }
.ico { flex: none; width: 24px; height: 24px; color: var(--mist); display: block; }
.ico svg { width: 24px; height: 24px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ico svg text { fill: currentColor; stroke: none; font-family: var(--font); font-weight: 700; }
.txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.nm { font-size: 14px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; }
.hd { font-size: 14px; font-weight: 500; color: var(--mist); letter-spacing: 0.02em; overflow-wrap: anywhere; }
.go {
  flex: none;
  align-self: stretch;
  width: 64px;
  display: grid;
  place-items: center;
  border-left: 1px solid var(--line);
  color: var(--foam);
  transition: background 0.25s ease, color 0.25s ease;
}
.go svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.25s ease; }
.link:hover .go, .link:focus-visible .go { background: var(--foam); color: var(--abyss); }
.link:hover .go svg { transform: translateX(3px); }

@media (prefers-reduced-motion: reduce) {
  .flower { animation: none; }
  .link, .go, .go svg { transition: none; }
}
</style>
</head>
<body>
<div class="sea" aria-hidden="true"><canvas id="bg"></canvas></div>
<div class="tint" aria-hidden="true"></div>

<main class="page">

<script>(function () {
  var c = document.getElementById("bg");
  if (!c) return;
  var gl = c.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  if (!gl) return;
  var vs = "attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";
  var fs = [
    "#ifdef GL_FRAGMENT_PRECISION_HIGH",
    "precision highp float;",
    "#else",
    "precision mediump float;",
    "#endif",
    "uniform vec2 uRes;",
    "uniform float uT;",
    "float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
    "float field(vec2 p){",
    "  float t=uT*0.11;",
    "  for(int i=0;i<6;i++){",
    "    float fi=float(i);",
    "    p+=0.78*vec2(sin(p.y*1.35+t*(1.0+0.3*fi)+fi*1.7),cos(p.x*1.15-t*(0.8+0.25*fi)+fi*2.3));",
    "    p=mat2(0.8,-0.6,0.6,0.8)*p*1.12;",
    "  }",
    "  return 0.5+0.25*(sin(p.x)+sin(p.y*1.3));",
    "}",
    "void main(){",
    "  vec2 p0=(gl_FragCoord.xy-0.5*uRes)/uRes.y*4.6;",
    "  float e=0.012;",
    "  float h0=field(p0);",
    "  float gx=(field(p0+vec2(e,0.0))-h0)/e;",
    "  float gy=(field(p0+vec2(0.0,e))-h0)/e;",
    "  vec3 n=normalize(vec3(-gx*1.9,-gy*1.9,1.0));",
    "  vec3 V=vec3(0.0,0.0,1.0);",
    "  vec3 L1=normalize(vec3(-0.45,0.6,0.75));",
    "  vec3 L2=normalize(vec3(0.7,-0.25,0.6));",
    "  float diff=dot(n,L1)*0.5+0.5;",
    "  float s1=pow(max(dot(reflect(-L1,n),V),0.0),40.0);",
    "  float s2=pow(max(dot(reflect(-L2,n),V),0.0),70.0);",
    "  float fres=pow(1.0-n.z,1.6);",
    "  vec3 deep=vec3(0.02,0.09,0.24);",
    "  vec3 mid=vec3(0.16,0.43,0.74);",
    "  vec3 lite=vec3(0.62,0.82,0.98);",
    "  vec3 col=mix(deep,mid,smoothstep(0.25,0.85,diff));",
    "  col=mix(col,lite,clamp(h0*0.3+fres*0.9,0.0,1.0)*0.55);",
    "  col+=s1*vec3(1.0,0.97,0.93)*1.15+s2*vec3(0.8,0.9,1.0)*0.85;",
    "  vec2 g=gl_FragCoord.xy/uRes.y*20.0;",
    "  vec2 id=floor(g);",
    "  vec2 f=fract(g)-0.5;",
    "  float r=hash(id);",
    "  vec2 off=(vec2(hash(id+3.1),hash(id+7.7))-0.5)*0.6;",
    "  float tw=pow(max(0.0,sin(uT*(0.6+r*1.4)+r*40.0)),6.0);",
    "  col+=step(0.9,r)*tw*smoothstep(0.1,0.0,length(f-off))*vec3(1.0,0.97,0.92);",
    "  gl_FragColor=vec4(pow(clamp(col,0.0,1.0),vec3(0.95)),1.0);",
    "}"
  ].join("\n");
  function sh(type, src) {
    var o = gl.createShader(type);
    gl.shaderSource(o, src);
    gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(o)); return null; }
    return o;
  }
  var v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return;
  var pr = gl.createProgram();
  gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
  gl.useProgram(pr);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(pr, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var uRes = gl.getUniformLocation(pr, "uRes"), uT = gl.getUniformLocation(pr, "uT");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var run = true, last = 0;
  function size() {
    var w = window.innerWidth, h = window.innerHeight;
    var s = Math.min(1, Math.sqrt(420000 / (w * h)));
    c.width = Math.max(2, Math.round(w * s));
    c.height = Math.max(2, Math.round(h * s));
    gl.viewport(0, 0, c.width, c.height);
  }
  function draw(now) {
    gl.uniform2f(uRes, c.width, c.height);
    gl.uniform1f(uT, now / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    c.classList.add("ready");
  }
  function loop(now) {
    if (!run) return;
    if (now - last > 33) { last = now; draw(now); }
    requestAnimationFrame(loop);
  }
  document.addEventListener("visibilitychange", function () {
    run = !document.hidden;
    if (run && !reduce) requestAnimationFrame(loop);
  });
  window.addEventListener("resize", function () { size(); draw(reduce ? 4000 : performance.now()); });
  c.addEventListener("webglcontextlost", function (e) { e.preventDefault(); run = false; }, false);
  size();
  if (reduce) { draw(4000); } else { requestAnimationFrame(loop); }
})();
